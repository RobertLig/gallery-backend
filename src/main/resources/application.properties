quarkus.application.name=gallery-backend
quarkus.http.port=${PORT:8080}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept-Language
quarkus.http.cors.access-control-allow-credentials=true

quarkus.default-locale=en
quarkus.locales=en,pl

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:gallery}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:gallery}
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%prod.quarkus.flyway.migrate-at-start=true

%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%dev.quarkus.flyway.migrate-at-start=false
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.flyway.migrate-at-start=false

google.client.id=${GOOGLE_CLIENT_ID:replace-with-google-client-id}
frontend.base.url=${FRONTEND_BASE_URL:http://localhost:3000}
app.auth.admin-email=${ADMIN_EMAIL:not-configured}
app.auth.refresh-days=${REFRESH_TOKEN_DAYS:30}
app.auth.cookie.secure=${REFRESH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${REFRESH_COOKIE_SAME_SITE:LAX}
app.gallery.currency=${GALLERY_CURRENCY:PLN}
app.stripe.secret-key=${STRIPE_SECRET_KEY:not-configured}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:not-configured}

%prod.mp.jwt.verify.publickey.location=${JWT_VERIFY_PUBLIC_KEY_LOCATION}
%prod.mp.jwt.verify.issuer=gallery-app
%prod.smallrye.jwt.sign.key.location=${JWT_SIGNING_KEY_LOCATION}
%prod.smallrye.jwt.sign.algorithm=RS256
%prod.smallrye.jwt.new-token.issuer=gallery-app
%prod.app.auth.cookie.secure=${REFRESH_COOKIE_SECURE:true}
%prod.app.auth.cookie.same-site=${REFRESH_COOKIE_SAME_SITE:NONE}
%prod.app.stripe.secret-key=${STRIPE_SECRET_KEY}
%prod.app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

%dev.mp.jwt.verify.publickey.location=${JWT_VERIFY_PUBLIC_KEY_LOCATION:target/jwt-public.pem}
%dev.mp.jwt.verify.issuer=gallery-app
%dev.smallrye.jwt.sign.key.location=${JWT_SIGNING_KEY_LOCATION:target/jwt-private.pem}
%dev.smallrye.jwt.sign.algorithm=RS256
%dev.smallrye.jwt.new-token.issuer=gallery-app

%prod.bucket.name=${SUPABASE_S3_BUCKET}
%prod.quarkus.s3.aws.region=${SUPABASE_S3_REGION:eu-west-1}
%prod.quarkus.s3.endpoint-override=${SUPABASE_S3_ENDPOINT}
%prod.quarkus.s3.path-style-access=true
%prod.quarkus.s3.aws.credentials.type=static
%prod.quarkus.s3.aws.credentials.static-provider.access-key-id=${SUPABASE_S3_ACCESS_KEY_ID}
%prod.quarkus.s3.aws.credentials.static-provider.secret-access-key=${SUPABASE_S3_SECRET_ACCESS_KEY}

%dev.bucket.name=gallery-local
%dev.quarkus.s3.aws.region=eu-central-1
%dev.quarkus.s3.aws.credentials.type=static
%dev.quarkus.s3.aws.credentials.static-provider.access-key-id=test
%dev.quarkus.s3.aws.credentials.static-provider.secret-access-key=test
%dev.quarkus.s3.devservices.enabled=true
%dev.quarkus.s3.devservices.buckets=gallery-local

%test.quarkus.s3.devservices.enabled=false
